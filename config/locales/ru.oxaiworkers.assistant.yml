ru:
  oxaiworkers:
    assistant:
      sysop:
        title: "Системный оператор"
        description: "Выполняет системные команды и операции с файлами"
        capabilities: "выполнение shell-команд, чтение и запись файлов, анализ системной информации"
        role: "Ты опытный системный администратор, который может выполнять shell-команды и операции с файловой системой. Твоя задача - безопасно и эффективно управлять системой."
      coder:
        title: "Программист"
        description: "Пишет и анализирует код"
        capabilities: "генерация кода, рефакторинг, анализ кода, оптимизация"
        role: "Ты опытный программист, который пишет чистый, эффективный код и может объяснить сложные технические концепции простым языком."
        role_with_language: "Ты опытный программист на %{language}, который пишет чистый, эффективный код и может объяснить сложные технические концепции простым языком."
      localizer:
        title: "Локализатор"
        description: "Выполняет перевод и адаптацию контента"
        capabilities: "перевод текста, адаптация контента, сохранение форматирования"
        role: "Ты опытный переводчик и локализатор контента с языка %{source_lang}. Твоя задача - перевести контент, сохраняя его смысл, стиль и форматирование."
        role_with_target: "Ты опытный переводчик и локализатор контента с языка %{source_lang} на %{target_lang}. Твоя задача - перевести контент, сохраняя его смысл, стиль и форматирование."
        source: "Исходный язык: %{source_lang}"
        locale: "Целевой язык: %{target_lang}"
      orchestrator:
        role: "Ты оркестратор, координирующий работу между различными ассистентами. Твоя задача - распределять задачи между ассистентами и организовывать их взаимодействие для достижения общей цели."
        assistant_list_header: "Доступные ассистенты и их возможности:"
        assistant_info: "ID: %{id}, Тип: %{type}, Название: %{title}\nОписание: %{description}\nВозможности: %{capabilities}"
        workflow_task: |
          Вам необходимо организовать рабочий процесс согласно следующему описанию:

          %{workflow_description}

          Разработайте план действий, распределив задачи между доступными ассистентами, 
          и координируйте их взаимодействие для достижения цели.

          Для каждого шага укажите:
          1. ID ассистента, который должен выполнить задачу
          2. Описание задачи для ассистента
          3. Ожидаемый результат

          После завершения каждого шага анализируйте результат и принимайте решение о дальнейших действиях.
        result_received: |
          Получен результат от ассистента %{assistant_id}:

          %{result}

          Проанализируйте результат и определите следующий шаг в рабочем процессе.
      workspace:
        title: "Рабочее пространство"
        description: "Коллекция взаимодействующих ассистентов"
        orchestrator_title: "Оркестратор"
        orchestrator_description: "Управляет взаимодействием между ассистентами"
        orchestrator_capabilities: "планирование рабочего процесса, распределение задач, мониторинг выполнения"
        status_pending: "в ожидании"
        status_completed: "завершено"
        status_error: "ошибка"
        status_waiting: "ожидание"
        parse_assistant_id: "ID ассистента:"
        parse_task: "Задача:"
        parse_expected_result: "Ожидаемый результат:"
        cannot_delete_orchestrator: "Невозможно удалить оркестратора из рабочего пространства"
        error_assistant_exists: "Ассистент с id '%{id}' уже существует"
        error_assistant_module: "Ассистент должен включать ModuleBase"
        error_assistant_not_found: "Ассистент с id '%{id}' не найден"
        error_assistant_id_not_found: "Ассистент с ID '%{id}' не найден"
        waiting_orchestrator: "Ожидание ответа от оркестратора"
      message_from: "Сообщение от %{from}: %{message}"
    callbacks:
      monologue: "монолог"
      voice: "голос"
      action: "действие"
      summary: "итог"