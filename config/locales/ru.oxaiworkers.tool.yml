ru:
  oxaiworkers:
    tool:
      eval:
        ruby:
          description: Выполнить код на ruby и вернуть результат последней строки
          input: Исходный код на Ruby
        sh:
          description: Выполнить sh-команду и получить результат (stdout + stderr)
          input: Исходная команда
      file_system:
        list_directory:
          description: 'Инструмент файловой системы: Выводит содержимое указанного каталога'
          directory_path: 'Путь к каталогу для вывода содержимого'
        read_file:
          description: 'Инструмент файловой системы: Считывает содержимое текстового файла'
          file_path: 'Путь к файлу для считывания'
        write_to_file:
          description: 'Инструмент файловой системы: Записывает содержимое в файл'
          file_path: 'Путь к файлу для записи'
          content: 'Содержимое для записи в файл'
      database_tool:
        list_tables:
          description: 'Инструмент базы данных: Возвращает список таблиц в базе данных'
        describe_tables:
          description: 'Инструмент базы данных: Возвращает схему для списка таблиц'
          tables: 'Таблицы для описания'
        dump_schema:
          description: 'Инструмент базы данных: Возвращает схему базы данных'
        execute:
          description: 'Инструмент базы данных: Выполняет SQL-запрос и возвращает результаты'
          input: 'SQL-запрос для выполнения'
      pipeline:
        send_message:
          description: 'Отправить сообщение другому ассистенту'
          message: 'Сообщение или задача для отправки'
          result: 'Описание ожидаемого результата, что должно быть получено на выходе'
          example: 'Пример хорошего результата'
          to_id: 'ID ассистента получателя'
        assistant_info: "ID: **%{id}**, Название: %{title}\nРоль: %{role}\nОписание: %{description}\nВозможности: %{capabilities}"
      pixels:
        generate_image:
          description: 'Инструмент генерации изображений: Создает изображение на основе предоставленного текстового запроса на **английском языке**.'
          prompt: 'Текстовое описание изображения для генерации строго **на английском** языке'
          size: 'Размер генерируемого изображения'
          quality: 'Качество генерируемого изображения'
          file_name: 'Имя файла для сохранения изображения в формате png. Например: image.png'
        edit_image:
          description: 'Инструмент редактирования изображений: Редактирует изображение на основе предоставленного текстового запроса.'
          input_image: 'URL или путь к изображению для редактирования'
          prompt: 'Текстовое описание действий для редактирования изображения'
      wolfram_alpha:
        ask:
          description: 'Инструмент Wolfram Alpha: Запрос к вычислительной базе знаний Wolfram Alpha. Функция позволяет получать актуальные данные из различных областей знаний (экономика, финансы, погода, климат, астрономия, космос, транспорт, право, спорт).'
          prompt: 'Запрос для отправки в Wolfram Alpha на **английском** языке'
          location: 'Информация о местоположении для контекста запроса на **английском** языке. Например: Moscow, Russia'
