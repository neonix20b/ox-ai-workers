en:
  oxaiworkers:
    tool:
      eval:
        ruby:
          description: "Execute Ruby code and return the result of the last expression"
          input: "Ruby source code"
        sh:
          description: "Execute a sh command and get the result (stdout + stderr)"
          input: "Source command"
      file_system:
        list_directory:
          description: 'File System Tool: Lists out the content of a specified directory'
          directory_path: 'Directory path to list'
        read_file:
          description: 'File System Tool: Reads the contents of a text file'
          file_path: 'Path to the file to read from'
        write_to_file:
          description: 'File System Tool: Write content to a file'
          file_path: 'Path to the file to write'
          content: 'Content to write to the file'
      database_tool:
        list_tables:
          description: 'Database Tool: Returns a list of tables in the database'
        describe_tables:
          description: 'Database Tool: Returns the schema for a list of tables'
          tables: 'The tables to describe'
        dump_schema:
          description: 'Database Tool: Returns the database schema'
        execute:
          description: 'Database Tool: Executes a SQL query and returns the results'
          input: 'SQL query to be executed'
      pipeline:
        send_message:
          description: 'Send a message to another assistant'
          message: 'Message or task to send'
          result: 'Description of the expected result, what should be obtained as output'
          example: 'Example of a good result'
          to_id: 'Recipient assistant ID'
        assistant_info: "ID: **%{id}**, Title: %{title}\nRole: %{role}\nDescription: %{description}\nCapabilities: %{capabilities}"
      pixels:
        generate_image:
          description: 'Image Generation Tool: Creates an image based on the provided text prompt on **English language**.'
          prompt: 'Text description of the image to generate on **English language**'
          size: 'Size of the generated image'
          quality: 'Quality of the generated image'
          file_name: 'File name for saving the generated image in png format. For example: image.png'
      wolfram_alpha:
        ask:
          description: 'Wolfram Alpha Tool: Query the Wolfram Alpha computational knowledge engine'
          prompt: 'The query to send to Wolfram Alpha'
          location: 'Location information to provide context for the query'